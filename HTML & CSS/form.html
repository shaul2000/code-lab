<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Join The Apex Burger Club!</h1>
    <form action="#" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="favourite-burger">Favorite Burger:</label>
        <select id="favourite-burger" name="favorite-burger" required>
            <option value="#">Select your favorite burger</option>
            <option value="classic-cheeseburger">Classic Cheeseburger</option>
            <option value="bacon-bbq-burger">Bacon BBQ Burger</option>
            <option value="veggie-delight-burger">Veggie Delight Burger</option>
            <option value="spicy-chicken-burger">Spicy Chicken Burger</option>
        </select><br><br>

        <label for="extras">Additional Extras:</label><br>
        <input type="checkbox" id="extras" name="extras" value="lettuce">
        <label for="extras">Lettuce</label><br>
        <input type="checkbox" id="extras" name="extras" value="tomato">
        <label for="extras">Tomato</label><br>
        <input type="checkbox" id="extras" name="extras" value="onion">
        <label for="extras">Onion</label><br><br>

        <input type="submit" value="Join the club!">
    </form>
</body>
</html>
